server:
  port: 8080

spring:
  # PostgreSQL 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/degging?reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # MongoDB 및 Redis 설정
  data:
    mongodb:
      uri: mongodb://localhost:27017/degging
    redis:
      host: localhost
      port: 6379

  profiles:
    active: local