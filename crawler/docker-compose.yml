version: '3.9'

services:
  postgres:
    # 하이브리드 서치용 이미지 (pgvector + pg_textsearch BM25 + textsearch_ko MeCab-KO)
    # GitHub: https://github.com/id4thomas/pgvec-textsearch
    # 빌드 환경: aarch64 (ARM64) → ARM 환경에서 실행 필요
    image: id4thomas/pgvec-textsearch-ko:260204-0.8.1-pg18-trixie-0.5.0
    platform: linux/arm64
    container_name: cafe_postgres
    environment:
      POSTGRES_DB: cafe_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # 이미지 PGDATA 경로: /var/lib/postgresql/18/docker
      - postgres_data:/var/lib/postgresql
      # 이미지 내장 init 순서: 01(extensions) → 02(RRF함수) → 03(MeCab-KO)
      # 04번으로 마운트해 스키마 초기화를 마지막에 실행
      - ./init.sql:/docker-entrypoint-initdb.d/04-init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
